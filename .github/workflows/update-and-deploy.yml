name: Update & Deploy
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'full' && 'Rotate + deploy' || 'Full update + deploy' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Rotate one worker, or refresh all workers and Pages
        type: choice
        options:
          - auto
          - full
        default: auto
      deploy_now:
        description: Compatibility flag for existing dispatch callers; fresh pages publish automatically
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - ".github/workflows/gw2-action.yml"
      - ".github/workflows/rhacco-news.yml"
      - "worker-gw2a/**"
      - "worker-rnews/**"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  choose_workers:
    name: Select workers
    runs-on: ubuntu-24.04
    outputs:
      gw2_action: ${{ steps.choose.outputs.gw2_action }}
      rhacco_news: ${{ steps.choose.outputs.rhacco_news }}
      full: ${{ steps.choose.outputs.full }}
    steps:
      - name: Pick rotation
        id: choose
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          workers=(gw2_action rhacco_news)
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "push" || "${DISPATCH_MODE}" == "full" ]]; then
            selected=("${workers[@]}")
            echo "full=true" >> "${GITHUB_OUTPUT}"
          else
            selected=("${workers[$(( (GITHUB_RUN_NUMBER - 1) % ${#workers[@]} ))]}")
            echo "full=false" >> "${GITHUB_OUTPUT}"
          fi
          for worker in "${workers[@]}"; do
            enabled=false
            for target in "${selected[@]}"; do
              if [[ "${worker}" == "${target}" ]]; then enabled=true; fi
            done
            echo "${worker}=${enabled}" >> "${GITHUB_OUTPUT}"
          done
          printf 'Selected workers: %s\n' "${selected[*]}"

  gw2_action:
    permissions:
      contents: write
      actions: write
    name: GW2 Action
    needs: choose_workers
    if: ${{ needs.choose_workers.outputs.gw2_action == 'true' }}
    uses: ./.github/workflows/gw2-action.yml
    with:
      called_by_central: true
    secrets: inherit

  rhacco_news:
    permissions:
      contents: write
      actions: write
    name: Rhacco News
    needs: choose_workers
    if: ${{ needs.choose_workers.outputs.rhacco_news == 'true' }}
    uses: ./.github/workflows/rhacco-news.yml
    with:
      called_by_central: true
    secrets: inherit

  deploy_pages:
    name: Deploy Pages
    needs:
      - choose_workers
      - gw2_action
      - rhacco_news
    # Publish only when a worker confirms a new state commit. Keep the existing
    # release when a worker or Pages cannot confirm a fresh deployment.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A blocked Pages environment must not pause the minute-by-minute workers.
    concurrency:
      group: rhacco-pages-deploy
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GW2_STATE_BRANCH: gw2-action-state
      RN_STATE_BRANCH: rhacco-news-state
      GW2_RESULT: ${{ needs.gw2_action.result }}
      RN_RESULT: ${{ needs.rhacco_news.result }}
      GW2_UPDATED: ${{ needs.gw2_action.outputs.state_updated }}
      RN_UPDATED: ${{ needs.rhacco_news.outputs.state_updated }}

    steps:
      - name: Check publish
        id: pick
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          FULL_UPDATE: ${{ needs.choose_workers.outputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FULL_UPDATE}" = "true" ]; then
            if [ "${GW2_UPDATED}" = "true" ] && [ "${RN_UPDATED}" = "true" ]; then
              echo "publish=true" >> "${GITHUB_OUTPUT}"
              echo "Complete scheduled/push/full update; publish both refreshed pages."
            else
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "reason=incomplete_full_update" >> "${GITHUB_OUTPUT}"
              echo "At least one full-update worker did not confirm a new state; keep the current Pages release."
            fi
          elif [ "${GW2_UPDATED}" = "true" ] || [ "${RN_UPDATED}" = "true" ]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Publish both Pages after the confirmed rotating-worker update."
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "reason=no_fresh_state" >> "${GITHUB_OUTPUT}"
            echo "No new worker state confirmed; keep the current Pages release."
          fi

      - name: Checkout code
        id: checkout
        continue-on-error: true
        if: ${{ !cancelled() && steps.pick.outputs.publish == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build Pages
        id: assemble
        continue-on-error: true
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "GW2 worker result: ${GW2_RESULT}"
          echo "Rhacco News worker result: ${RN_RESULT}"

          rm -rf _site
          mkdir -p _site
          : > _site/.nojekyll

          copy_state_page() {
            local branch="$1"
            local source="$2"
            local target="$3"
            local label="$4"

            local attempt
            for attempt in 1 2 3; do
              if git fetch --force --no-tags origin "${branch}:refs/remotes/origin/${branch}"; then
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "${label}: unable to fetch ${branch}; keeping the last published site." >&2
                return 1
              fi
              sleep "${attempt}"
            done

            if ! git cat-file -e "origin/${branch}:${source}" 2>/dev/null; then
              echo "${label}: ${branch}:${source} is missing." >&2
              return 1
            fi

            mkdir -p "$(dirname "${target}")"
            if ! git show "origin/${branch}:${source}" > "${target}" || ! test -s "${target}"; then
              rm -f "${target}"
              echo "${label}: missing or empty page in ${branch}; refusing to publish it." >&2
              return 1
            fi

            if ! grep -Fq "<title>${label}</title>" "${target}" ||
               ! grep -Eq '<meta name="page-generated-at-ms" content="[0-9]+">' "${target}" ||
               ! grep -Fq '</html>' "${target}"; then
              rm -f "${target}"
              echo "${label}: incomplete state page; keeping the last published site." >&2
              return 1
            fi

            local state_time
            state_time="$(git log -1 --format='%cI' "origin/${branch}" 2>/dev/null || true)"
            echo "Added ${label}: ${branch}:${source} -> ${target} (state ${state_time:-unknown})"
          }

          HAS_RN=0
          HAS_GW2=0
          if copy_state_page "${RN_STATE_BRANCH}" "worker-rnews/index.html" "_site/rn/index.html" "Rhacco News"; then
            HAS_RN=1
          fi
          if copy_state_page "${GW2_STATE_BRANCH}" "worker-gw2a/index.html" "_site/gw/index.html" "GW2 Action"; then
            HAS_GW2=1
          fi

          if [ "${HAS_RN}" -ne 1 ] || [ "${HAS_GW2}" -ne 1 ]; then
            echo "Both valid worker pages are required; keeping the last published site." >&2
            exit 1
          fi

          # Do not replace the site with an outdated state page from either worker.
          python3 - <<'PY'
          import re
          import time
          from pathlib import Path

          now_ms = int(time.time() * 1000)
          for path in ("_site/rn/index.html", "_site/gw/index.html"):
              match = re.search(rb'<meta name="page-generated-at-ms" content="(\d+)">', Path(path).read_bytes())
              if not match:
                  raise SystemExit(f"{path}: missing generation time")
              age_ms = now_ms - int(match.group(1))
              if age_ms > 900000 or age_ms < -120000:
                  raise SystemExit(f"{path}: state page is too old or has a future timestamp")
          PY

          {
            cat <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="color-scheme" content="dark">
            <meta name="theme-color" content="#101114">
            <title>Rhacco</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;width:100%;min-height:100%;background:#101114;color:#f7f7f8}
              body{min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(440px,100%);margin:auto;display:grid;gap:14px;align-content:center;justify-items:stretch;transform:translateY(17px)}
              a{width:100%;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 20px;border:1px solid #30323a;border-radius:15px;background:#181a1f;color:#f7f7f8;text-align:center;text-decoration:none;box-shadow:0 8px 26px rgba(0,0,0,.18);transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease}
              a .title{font-size:17px;font-weight:650;letter-spacing:.01em}
              a .info{font-size:11px;font-weight:400;line-height:1.3;color:#b2b6c1}
              a:hover{background:#20232a;border-color:#555b69;transform:translateY(-1px);box-shadow:0 11px 30px rgba(0,0,0,.24)}
              a:active{transform:translateY(0)}
              a:focus-visible{outline:3px solid #8f7cff;outline-offset:3px}
              .workflow-status{position:fixed;inset-inline:0;bottom:max(20px,env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
              .workflow-badge{width:auto;min-height:0;display:inline-flex;gap:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;transition:none;pointer-events:auto}
              .workflow-badge:hover,.workflow-badge:active{background:transparent;border:0;box-shadow:none;transform:none}
              .workflow-badge img{display:block;max-width:100%;height:auto}
              @media (max-width:520px){body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}main{gap:12px;transform:translateY(16px)}.workflow-status{bottom:max(16px,env(safe-area-inset-bottom))}a{min-height:64px;border-radius:13px}a .title{font-size:16px}}
              @media (min-width:900px){main{width:min(460px,100%)}}
              @media (prefers-reduced-motion:reduce){a{transition:none}}
            </style>
          </head>
          <body>
            <main aria-label="Pages">
          HTML
            if [ "${HAS_RN}" -eq 1 ]; then
              echo '      <a href="rn/"><span class="title">Rhacco News</span><span class="info">World news, science, royals, and cyber stories.</span></a>'
            fi
            if [ "${HAS_GW2}" -eq 1 ]; then
              echo '      <a href="gw/"><span class="title">GW2 Action</span><span class="info">Live events, maps, and activities in Guild Wars 2.</span></a>'
            fi
            cat <<'HTML'
            </main>
            <footer class="workflow-status" aria-label="Workflow status">
              <a class="workflow-badge" href="https://github.com/Rhacco/now/actions/workflows/update-and-deploy.yml">
                <img src="https://github.com/Rhacco/now/actions/workflows/update-and-deploy.yml/badge.svg" alt="Update & Deploy workflow status">
              </a>
            </footer>
          </body>
          </html>
          HTML
          } > _site/index.html

          echo "Pages artifact:"
          find _site -maxdepth 2 -type f -print | sort

          # A dispatch on the same default-branch commit has the same GITHUB_SHA.
          # Use a real, freshly published state commit for each Pages deployment.
          if [ "${RN_UPDATED}" = true ] && [ "${HAS_RN}" -eq 1 ]; then
            build_branch="${RN_STATE_BRANCH}"
          elif [ "${GW2_UPDATED}" = true ] && [ "${HAS_GW2}" -eq 1 ]; then
            build_branch="${GW2_STATE_BRANCH}"
          else
            echo "Neither worker published a fresh state; refusing a stale deployment." >&2
            exit 1
          fi
          build_version="$(git rev-parse "origin/${build_branch}")"
          git cat-file -e "${build_version}^{commit}"
          echo "build_version=${build_version}" >> "${GITHUB_OUTPUT}"
          echo "Pages build version: ${build_version} (${build_branch})"

      - name: Configure Pages
        id: pages
        continue-on-error: true
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages
        id: upload
        continue-on-error: true
        if: ${{ !cancelled() && steps.pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        continue-on-error: true
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          BUILD_VERSION: ${{ steps.assemble.outputs.build_version }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID);
            const buildVersion = process.env.BUILD_VERSION;
            if (!Number.isSafeInteger(artifactId) || !/^[a-f0-9]{40}$/.test(buildVersion)) {
              throw new Error('Missing Pages artifact or valid state commit');
            }
            const {owner, repo} = context.repo;
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            const temporary = error => [429, 500, 502, 503, 504].includes(error?.status);
            // Same GitHub API and job OIDC token used by actions/deploy-pages.
            const token = await core.getIDToken();
            const create = version => github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifactId, pages_build_version: version, oidc_token: token
            });
            const status = id => github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
              owner, repo, id
            });

            // A broken POST response does not prove that GitHub rejected the deployment.
            // Query by its build commit before sending the artifact again.
            async function findAccepted(version) {
              let uncertain = false;
              for (let attempt = 1; attempt <= 3; attempt++) {
                await pause(attempt * 2000);
                try {
                  const {data} = await status(version);
                  if (data?.status) return true;
                  throw new Error('Pages returned an incomplete deployment status');
                } catch (error) {
                  if (error.status === 404) continue;
                  if (temporary(error)) { uncertain = true; continue; }
                  throw error;
                }
              }
              if (uncertain) throw new Error('Could not verify whether Pages accepted the deployment');
              return false;
            }

            async function createOrRecover(version) {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return (await create(version)).data;
                } catch (error) {
                  if (!temporary(error) && !(error.status === 422 && attempt > 1)) throw error;
                  core.warning('Pages creation response failed (HTTP ' + (error.status || '?') + '); checking the deployment status.');
                  if (await findAccepted(version)) return {id: version};
                  if (!temporary(error) || attempt === 3) throw error;
                  await pause(attempt * 3000);
                }
              }
            }

            let version = buildVersion;
            let deployment;
            try {
              deployment = await createOrRecover(version);
            } catch (error) {
              if (error.status !== 404 || version === context.sha) throw error;
              // Some Pages installations accept only the workflow commit.
              // The public freshness check below will still reject a stuck site.
              core.warning('Pages rejected the state commit; retrying with the workflow commit');
              version = context.sha;
              deployment = await createOrRecover(version);
            }
            const id = deployment?.id || deployment?.status_url?.split('/').pop();
            if (!id) throw new Error('Pages returned an incomplete deployment');
            let pageUrl = deployment.page_url;
            if (!pageUrl) {
              // Recovered a deployment whose POST response was lost.
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const {data} = await github.request('GET /repos/{owner}/{repo}/pages', {owner, repo});
                  pageUrl = data.html_url;
                  break;
                } catch (error) {
                  if (!temporary(error) || attempt === 3) throw error;
                  await pause(attempt * 2000);
                }
              }
            }
            if (!pageUrl) throw new Error('Pages did not return a public URL');
            core.info('Pages deployment ID: ' + id + ', build commit: ' + version);
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline) {
              await pause(5000);
              let data;
              try {
                ({data} = await status(id));
              } catch (error) {
                if (!temporary(error) && error.status !== 404) throw error;
                core.warning('Pages status temporarily unavailable (HTTP ' + (error.status || '?') + ').');
                continue;
              }
              if (data.status === 'succeed') {
                core.setOutput('page_url', pageUrl);
                core.info('Pages reports success: ' + pageUrl);
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error('Pages deployment failed: ' + data.status);
              }
              core.info('Pages status: ' + (data.status || 'pending'));
            }
            throw new Error('Pages deployment did not finish within 3 minutes');

      - name: Verify live Pages
        id: freshness
        continue-on-error: true
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          paths = ("gw/index.html", "rn/index.html")
          expected_times = {}
          for path in paths:
              local = Path("_site") / path
              if not local.is_file():
                  raise SystemExit(f"{path}: missing from the Pages artifact")
              stamp = re.search(rb'<meta name="page-generated-at-ms" content="(\d+)">', local.read_bytes())
              if not stamp:
                  raise SystemExit(f"{path}: artifact lacks a generation time")
              expected_times[path] = int(stamp.group(1))

          for attempt in range(7):
              failures = []
              now_ms = int(time.time() * 1000)
              for path, expected in expected_times.items():
                  url = urllib.parse.urljoin(base, path) + "?check=" + os.environ["RUN_ID"] + "-" + str(attempt)
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=12) as response:
                          actual = re.search(rb'<meta name="page-generated-at-ms" content="(\d+)">', response.read(1000000))
                      if not actual:
                          raise ValueError("published page lacks a generation time")
                      published = int(actual.group(1))
                      age_seconds = max(0, (now_ms - published) // 1000)
                      lag_seconds = max(0, (expected - published) // 1000)
                      print(f"{path}: public age {age_seconds}s, behind artifact {lag_seconds}s")
                      if age_seconds > 900 or lag_seconds > 120:
                          failures.append(f"{path}: Pages is serving an old page")
                  except Exception as error:
                      failures.append(f"{path}: public page could not be checked: {error}")
              if not failures:
                  break
              if attempt == 6:
                  raise SystemExit("\n".join(failures))
              print("Waiting 10s for Pages to serve the new version...")
              time.sleep(10)
          PY

      - name: Deploy summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PICK_OUTCOME: ${{ steps.pick.outcome }}
          PUBLISH: ${{ steps.pick.outputs.publish }}
          SKIP_REASON: ${{ steps.pick.outputs.reason }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.pages.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        shell: bash
        run: |
          if [ "${PICK_OUTCOME}" != "success" ]; then
            message="Publish decision failed; Pages was not deployed."
          elif [ "${PUBLISH}" != "true" ]; then
            if [ "${SKIP_REASON}" = "incomplete_full_update" ]; then
              message="Full update was incomplete; the current Pages release remains in place."
            else
              message="No new worker state confirmed; current Pages release remains in place."
            fi
          elif [ "${CHECKOUT_OUTCOME}" != "success" ] || [ "${ASSEMBLE_OUTCOME}" != "success" ] || [ "${CONFIGURE_OUTCOME}" != "success" ] || [ "${UPLOAD_OUTCOME}" != "success" ]; then
            message="Preparation failed; no Pages deployment was started."
          elif [ "${DEPLOY_OUTCOME}" != "success" ]; then
            message="Pages API did not confirm deployment; its public status is uncertain."
          elif [ "${FRESHNESS_OUTCOME}" != "success" ]; then
            message="Pages reported success, but public freshness was not verified."
          else
            message="Pages deployment and public freshness verified."
          fi
          if [ "${PICK_OUTCOME}" != "success" ] || { [ "${PUBLISH}" = "true" ] && [ "${FRESHNESS_OUTCOME}" != "success" ]; }; then
            echo "::warning::Deploy Pages: ${message} See the step logs."
          fi
          {
            echo "### Deploy Pages"
            echo "${message}"
            echo "Workers: GW2 ${GW2_RESULT} (new state ${GW2_UPDATED:-false}), News ${RN_RESULT} (new state ${RN_UPDATED:-false})."
            echo "Checkout: ${CHECKOUT_OUTCOME}; assemble: ${ASSEMBLE_OUTCOME}; configure: ${CONFIGURE_OUTCOME}; upload: ${UPLOAD_OUTCOME}; deploy: ${DEPLOY_OUTCOME}; public check: ${FRESHNESS_OUTCOME}."
          } >> "${GITHUB_STEP_SUMMARY}"
