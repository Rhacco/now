name: Update & Deploy
run-name: Full Update & Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  gw2_action:
    name: GW2 Action
    permissions:
      contents: write
    uses: ./.github/workflows/gw2-action.yml

  joke_machine:
    name: Joke Machine
    permissions:
      contents: write
    uses: ./.github/workflows/joke-machine.yml
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  deploy_pages:
    name: Deploy Pages
    needs: [gw2_action, joke_machine]
    # A failed joke run leaves the last published snapshot available.
    if: ${{ !cancelled() && needs.gw2_action.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rhacco-pages-deploy
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GW2_STATE_BRANCH: gw2-action-state
      RN_STATE_BRANCH: rhacco-news-state
      JMAC_STATE_BRANCH: joke-machine-state

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build Pages
        id: assemble
        run: bash scripts/prepare-pages.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          BUILD_VERSION: ${{ steps.assemble.outputs.build_version }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const deploy = require('./scripts/deploy-pages.cjs');
            await deploy({ github, context, core });

      - name: Verify Live Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/verify-pages.py
