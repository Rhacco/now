name: All Workers & Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: all-workers-pages
  cancel-in-progress: false

jobs:
  gw2_action:
    name: GW2 Action
    uses: ./.github/workflows/gw2-action.yml
    secrets: inherit

  rhacco_news:
    name: Rhacco News
    uses: ./.github/workflows/rhacco-news.yml
    secrets: inherit

  deploy_pages:
    name: Deploy all Pages
    needs:
      - gw2_action
      - rhacco_news
    if: >-
      ${{
        always() &&
        needs.gw2_action.result == 'success' &&
        needs.rhacco_news.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GW2_STATE_BRANCH: gw2-action-state
      RN_STATE_BRANCH: rhacco-news-state

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Assemble all Pages sites from worker state branches
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site
          : > _site/.nojekyll

          copy_state_page() {
            local branch="$1"
            local source="$2"
            local target="$3"
            local label="$4"

            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git fetch --force origin "${branch}:refs/remotes/origin/${branch}"
            else
              local rc=$?
              if [ "${rc}" -eq 2 ]; then
                echo "Required page state not initialized: ${label} (${branch})." >&2
                exit 1
              fi
              echo "Unable to inspect state branch ${branch}." >&2
              exit "${rc}"
            fi

            if ! git cat-file -e "origin/${branch}:${source}" 2>/dev/null; then
              echo "State branch ${branch} exists but ${source} is missing." >&2
              exit 1
            fi

            mkdir -p "$(dirname "${target}")"
            git show "origin/${branch}:${source}" > "${target}"
            test -s "${target}"
            echo "Added ${label}: ${branch}:${source} -> ${target}"
          }

          copy_state_page "${RN_STATE_BRANCH}" "rn/index.html" "_site/rn/index.html" "Rhacco News"
          copy_state_page "${GW2_STATE_BRANCH}" "gw2a/index.html" "_site/gw2a/index.html" "GW2 Action"

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="color-scheme" content="dark">
            <meta name="theme-color" content="#101114">
            <title>Rhacco</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;width:100%;min-height:100%;background:#101114;color:#f7f7f8}
              body{min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
              main{width:min(440px,100%);margin:auto;display:grid;gap:14px;align-content:center;justify-items:stretch}
              a{width:100%;min-height:62px;display:flex;align-items:center;justify-content:center;padding:15px 20px;border:1px solid #30323a;border-radius:15px;background:#181a1f;color:#f7f7f8;text-align:center;text-decoration:none;font-size:17px;font-weight:650;letter-spacing:.01em;box-shadow:0 8px 26px rgba(0,0,0,.18);transition:background .15s ease,border-color .15s ease,transform .15s ease,box-shadow .15s ease}
              a:hover{background:#20232a;border-color:#555b69;transform:translateY(-1px);box-shadow:0 11px 30px rgba(0,0,0,.24)}
              a:active{transform:translateY(0)}
              a:focus-visible{outline:3px solid #8f7cff;outline-offset:3px}
              @media (max-width:520px){body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}main{gap:12px}a{min-height:58px;font-size:16px;border-radius:13px}}
              @media (min-width:900px){main{width:min(460px,100%)}}
              @media (prefers-reduced-motion:reduce){a{transition:none}}
            </style>
          </head>
          <body>
            <main aria-label="Pages">
              <a href="rn/">Rhacco News</a>
              <a href="gw2a/">GW2 Action</a>
            </main>
          </body>
          </html>
          HTML

          mkdir -p _site/rhacco-news _site/gw2a-action
          cat > _site/rhacco-news/index.html <<'HTML'
          <!doctype html><html lang="de"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../rn/"><title>Rhacco News</title><a href="../rn/">Rhacco News öffnen</a></html>
          HTML
          cat > _site/gw2a-action/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../gw2a/"><title>GW2 Action</title><a href="../gw2a/">GW2 Action öffnen</a></html>
          HTML

          test -s _site/index.html
          test -s _site/rn/index.html
          test -s _site/gw2a/index.html
          echo "Pages artifact:"
          find _site -maxdepth 2 -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
