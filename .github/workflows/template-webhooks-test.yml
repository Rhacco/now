name: Template · Webhooks · Test

on:
  workflow_dispatch: {}

# Repository-level workflow; the run step targets this template folder only.
permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    defaults:
      run:
        working-directory: template-webhooks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Send test webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python app/main.py
