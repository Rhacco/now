name: Rhacco News
run-name: News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

env:
  STATE_BRANCH: rhacco-news-state

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rhacco-news-update
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore Cache
        run: bash scripts/page-state.sh restore worker-rnews

      - name: Build News Page
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 worker-rnews/app/engine.py

      - name: Save Page & Cache
        run: bash scripts/page-state.sh publish worker-rnews
