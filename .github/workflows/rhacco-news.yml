name: Rhacco News
run-name: "${{ !inputs.called_by_central && 'News: Start Full Update' || 'News: Update' }}"

on:
  workflow_call:
    inputs:
      called_by_central:
        description: The run was invoked by Update & Deploy
        type: boolean
        default: false
    outputs:
      state_updated:
        description: A new state commit was confirmed
        value: ${{ jobs.update.outputs.state_updated }}
      state_ready:
        description: The state update finished successfully, even if no files changed
        value: ${{ jobs.update.outputs.state_ready }}
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

env:
  STATE_BRANCH: rhacco-news-state

jobs:
  update:
    name: ${{ !inputs.called_by_central && 'Start Full Update' || 'Update' }}
    # Standalone manual and scheduled runs request a complete site refresh.
    concurrency:
      group: ${{ !inputs.called_by_central && format('rhacco-news-update-standalone-{0}', github.run_id) || 'rhacco-news-update' }}
      queue: max
      cancel-in-progress: false
    outputs:
      state_updated: ${{ steps.publish.outputs.state_updated }}
      state_ready: ${{ steps.publish.outcome == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Start Full Update
        if: ${{ !inputs.called_by_central }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run update-and-deploy.yml --ref "${DEFAULT_BRANCH}" -f mode=full

      - name: Checkout Code
        if: ${{ inputs.called_by_central }}
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set Up Python
        id: python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore Cache
        id: restore
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-rnews/data

          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch --force origin "${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"

            cache_path="worker-rnews/data/cache.json"
            if git cat-file -e "origin/${STATE_BRANCH}:${cache_path}" 2>/dev/null; then
              git show "origin/${STATE_BRANCH}:${cache_path}" > "${RUNNER_TEMP}/rhacco-news-cache.json"
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rhacco-news-cache.json").read_text(encoding="utf-8"))
          assert isinstance(cache, dict) and cache.get("version") in (1, 2)
          assert isinstance(cache.get("sources"), dict)
          PY
              mv "${RUNNER_TEMP}/rhacco-news-cache.json" worker-rnews/data/cache.json
              echo "Persistent cache restored from ${STATE_BRANCH}."
            else
              echo "${STATE_BRANCH} has no cache; refusing to replace its state with the seed." >&2
              exit 1
            fi
          else
            rc=$?
            if [ "${rc}" -eq 2 ]; then
              echo "${STATE_BRANCH} does not exist yet; the first successful run will create it."
            else
              echo "Unable to inspect ${STATE_BRANCH}." >&2
              exit "${rc}"
            fi
          fi

      - name: Build News Page
        id: generate
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 worker-rnews/app/engine.py

      - name: Save Page & Cache
        id: publish
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          test -s worker-rnews/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("worker-rnews/data/cache.json").read_text(encoding="utf-8"))
          if state.get("version") != 2 or not isinstance(state.get("sources"), dict) or not any(
              isinstance(item, dict) and item.get("data") for item in state["sources"].values()
          ):
              raise SystemExit("Refusing to replace news state with empty or invalid data")
          PY

          STATE_DIR="${RUNNER_TEMP}/rhacco-news-state"
          rm -rf "${STATE_DIR}"

          git config user.name "rhacco-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/${STATE_BRANCH}"; then
            git worktree add --detach "${STATE_DIR}" "origin/${STATE_BRANCH}"
            git -C "${STATE_DIR}" checkout -B "${STATE_BRANCH}" "origin/${STATE_BRANCH}"
            STATE_EXISTS=1
          else
            git worktree add --detach "${STATE_DIR}" HEAD
            git -C "${STATE_DIR}" checkout --orphan "${STATE_BRANCH}"
            git -C "${STATE_DIR}" rm -rf . >/dev/null 2>&1 || true
            STATE_EXISTS=0
          fi

          rm -rf "${STATE_DIR}/rn" "${STATE_DIR}/worker-rnews" "${STATE_DIR}/worker-rn"
          mkdir -p "${STATE_DIR}/worker-rnews/data"

          cp worker-rnews/index.html "${STATE_DIR}/worker-rnews/index.html"
          cp worker-rnews/data/cache.json "${STATE_DIR}/worker-rnews/data/cache.json"

          git -C "${STATE_DIR}" add -A

          if git -C "${STATE_DIR}" diff --cached --quiet; then
            echo "No Rhacco News state/page update required."
            exit 0
          fi

          if [ "${STATE_EXISTS}" -eq 1 ]; then
            git -C "${STATE_DIR}" commit --amend -m "update rhacco news state"
            expected_remote="$(git rev-parse "refs/remotes/origin/${STATE_BRANCH}")"
          else
            git -C "${STATE_DIR}" commit -m "update rhacco news state"
            expected_remote=""
          fi

          new_head="$(git -C "${STATE_DIR}" rev-parse HEAD)"
          for attempt in 1 2 3; do
            if [ "${STATE_EXISTS}" -eq 1 ]; then
              if git -C "${STATE_DIR}" push \
                "--force-with-lease=refs/heads/${STATE_BRANCH}:${expected_remote}" \
                origin "HEAD:refs/heads/${STATE_BRANCH}"; then
                break
              fi
            else
              if git -C "${STATE_DIR}" push origin "HEAD:refs/heads/${STATE_BRANCH}"; then
                break
              fi
            fi

            # The remote may have accepted the push despite a broken response.
            for check in 1 2 3; do
              if remote_line="$(git ls-remote --heads origin "refs/heads/${STATE_BRANCH}")"; then
                break
              fi
              if [ "${check}" -eq 3 ]; then
                echo "Unable to verify the remote state after a failed push." >&2
                exit 1
              fi
              sleep "${check}"
            done
            remote_head="${remote_line%%$'\t'*}"
            if [ "${remote_head}" = "${new_head}" ]; then
              echo "State push was accepted despite a broken response."
              break
            fi
            if [ "${remote_head}" != "${expected_remote}" ]; then
              echo "State branch changed remotely; refusing to overwrite it." >&2
              exit 1
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "State push still failed after three attempts." >&2
              exit 1
            fi
            echo "State push failed; retrying after a short pause."
            sleep "$(( attempt * 2 ))"
          done

          echo "state_updated=true" >> "${GITHUB_OUTPUT}"

      - name: Update Summary
        if: ${{ !cancelled() && inputs.called_by_central }}
        continue-on-error: true
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_UPDATED: ${{ steps.publish.outputs.state_updated }}
        shell: bash
        run: |
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            if [ "${STATE_UPDATED}" = "true" ]; then
              message="**New Rhacco News page saved.**"
            else
              message="**Rhacco News page is already current.**"
            fi
          else
            message="**Rhacco News update could not be confirmed.**"
            echo "::warning::Rhacco News update not confirmed; see job logs."
          fi
          printf '%s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'Steps: checkout=%s Python=%s restore=%s build=%s save=%s\n' "${CHECKOUT_OUTCOME}" "${PYTHON_OUTCOME}" "${RESTORE_OUTCOME}" "${GENERATE_OUTCOME}" "${PUBLISH_OUTCOME}"
