name: Rhacco News

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhacco-news-update
  cancel-in-progress: false

env:
  STATE_BRANCH: rhacco-news-state

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout engine branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore latest persistent cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-rn/data

          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch --force origin "${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"

            if git cat-file -e "origin/${STATE_BRANCH}:worker-rn/data/cache.json" 2>/dev/null; then
              git show "origin/${STATE_BRANCH}:worker-rn/data/cache.json" > "${RUNNER_TEMP}/rhacco-news-cache.json"
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rhacco-news-cache.json").read_text(encoding="utf-8"))
          assert isinstance(cache, dict) and cache.get("version") == 1
          assert isinstance(cache.get("sources"), dict)
          PY
              mv "${RUNNER_TEMP}/rhacco-news-cache.json" worker-rn/data/cache.json
              echo "Persistent cache restored from ${STATE_BRANCH}."
            else
              echo "${STATE_BRANCH} has no cache; refusing to replace its state with the seed." >&2
              exit 1
            fi
          else
            rc=$?
            if [ "${rc}" -eq 2 ]; then
              echo "${STATE_BRANCH} does not exist yet; the first successful run will create it."
            else
              echo "Unable to inspect ${STATE_BRANCH}." >&2
              exit "${rc}"
            fi
          fi

      - name: Refresh Rhacco News
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python3 worker-rn/app/engine.py

      - name: Validate Rhacco News output
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile worker-rn/app/engine.py
          test -s rn/index.html
          test -s worker-rn/data/cache.json
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cards = 0
                  self.tabs = set()

              def handle_starttag(self, tag, attrs):
                  fields = dict(attrs)
                  if tag == "article" and "story-card" in fields.get("class", "").split():
                      self.cards += 1
                  if tag == "button" and "tab" in fields.get("class", "").split():
                      self.tabs.add(fields.get("data-tab"))

          page = Path("rn/index.html").read_text(encoding="utf-8")
          parsed = P()
          parsed.feed(page)
          assert "Rhacco News" in page
          assert '<html lang="en">' in page
          assert parsed.tabs == {"bio", "cyber", "dach", "royal", "world"}, parsed.tabs
          assert parsed.cards > 0, "refusing to publish an empty news page"
          cache = json.loads(Path("worker-rn/data/cache.json").read_text(encoding="utf-8"))
          assert cache.get("version") == 1 and isinstance(cache.get("sources"), dict)
          assert any(isinstance(entry, dict) and entry.get("data") for entry in cache["sources"].values()), "refusing to replace news cache with empty data"
          PY

      - name: Publish page and persistent cache to state branch
        shell: bash
        run: |
          set -euo pipefail

          STATE_DIR="${RUNNER_TEMP}/rhacco-news-state"
          rm -rf "${STATE_DIR}"

          git config user.name "rhacco-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/${STATE_BRANCH}"; then
            git worktree add --detach "${STATE_DIR}" "origin/${STATE_BRANCH}"
            git -C "${STATE_DIR}" checkout -B "${STATE_BRANCH}" "origin/${STATE_BRANCH}"
            STATE_EXISTS=1
          else
            git worktree add --detach "${STATE_DIR}" HEAD
            git -C "${STATE_DIR}" checkout --orphan "${STATE_BRANCH}"
            git -C "${STATE_DIR}" rm -rf . >/dev/null 2>&1 || true
            STATE_EXISTS=0
          fi

          rm -rf "${STATE_DIR}/rn" "${STATE_DIR}/worker-rn"
          mkdir -p "${STATE_DIR}/rn" "${STATE_DIR}/worker-rn/data"

          cp rn/index.html "${STATE_DIR}/rn/index.html"
          cp worker-rn/data/cache.json "${STATE_DIR}/worker-rn/data/cache.json"

          git -C "${STATE_DIR}" add -A

          if git -C "${STATE_DIR}" diff --cached --quiet; then
            echo "No Rhacco News state/page update required."
            exit 0
          fi

          if [ "${STATE_EXISTS}" -eq 1 ]; then
            git -C "${STATE_DIR}" commit --amend -m "update rhacco news state"
            git -C "${STATE_DIR}" push --force-with-lease origin "HEAD:${STATE_BRANCH}"
          else
            git -C "${STATE_DIR}" commit -m "update rhacco news state"
            git -C "${STATE_DIR}" push origin "HEAD:${STATE_BRANCH}"
          fi
