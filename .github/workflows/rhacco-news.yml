name: Rhacco News

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rhacco-news-update
  cancel-in-progress: false

env:
  STATE_BRANCH: rhacco-news-state

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout engine branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore latest persistent cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-rnews/data

          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch --force origin "${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"

            cache_path="worker-rnews/data/cache.json"
            if git cat-file -e "origin/${STATE_BRANCH}:${cache_path}" 2>/dev/null; then
              git show "origin/${STATE_BRANCH}:${cache_path}" > "${RUNNER_TEMP}/rhacco-news-cache.json"
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cache = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rhacco-news-cache.json").read_text(encoding="utf-8"))
          assert isinstance(cache, dict) and cache.get("version") in (1, 2)
          assert isinstance(cache.get("sources"), dict)
          PY
              mv "${RUNNER_TEMP}/rhacco-news-cache.json" worker-rnews/data/cache.json
              echo "Persistent cache restored from ${STATE_BRANCH}."
            else
              echo "${STATE_BRANCH} has no cache; refusing to replace its state with the seed." >&2
              exit 1
            fi
          else
            rc=$?
            if [ "${rc}" -eq 2 ]; then
              echo "${STATE_BRANCH} does not exist yet; the first successful run will create it."
            else
              echo "Unable to inspect ${STATE_BRANCH}." >&2
              exit "${rc}"
            fi
          fi

      - name: Refresh Rhacco News
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 worker-rnews/app/engine.py

      - name: Publish page and persistent cache to state branch
        shell: bash
        run: |
          set -euo pipefail

          test -s worker-rnews/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("worker-rnews/data/cache.json").read_text(encoding="utf-8"))
          if state.get("version") != 2 or not isinstance(state.get("sources"), dict) or not any(
              isinstance(item, dict) and item.get("data") for item in state["sources"].values()
          ):
              raise SystemExit("Refusing to replace news state with empty or invalid data")
          PY

          STATE_DIR="${RUNNER_TEMP}/rhacco-news-state"
          rm -rf "${STATE_DIR}"

          git config user.name "rhacco-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/${STATE_BRANCH}"; then
            git worktree add --detach "${STATE_DIR}" "origin/${STATE_BRANCH}"
            git -C "${STATE_DIR}" checkout -B "${STATE_BRANCH}" "origin/${STATE_BRANCH}"
            STATE_EXISTS=1
          else
            git worktree add --detach "${STATE_DIR}" HEAD
            git -C "${STATE_DIR}" checkout --orphan "${STATE_BRANCH}"
            git -C "${STATE_DIR}" rm -rf . >/dev/null 2>&1 || true
            STATE_EXISTS=0
          fi

          rm -rf "${STATE_DIR}/rn" "${STATE_DIR}/worker-rnews" "${STATE_DIR}/worker-rn"
          mkdir -p "${STATE_DIR}/worker-rnews/data"

          cp worker-rnews/index.html "${STATE_DIR}/worker-rnews/index.html"
          cp worker-rnews/data/cache.json "${STATE_DIR}/worker-rnews/data/cache.json"

          git -C "${STATE_DIR}" add -A

          if git -C "${STATE_DIR}" diff --cached --quiet; then
            echo "No Rhacco News state/page update required."
            exit 0
          fi

          if [ "${STATE_EXISTS}" -eq 1 ]; then
            git -C "${STATE_DIR}" commit --amend -m "update rhacco news state"
            git -C "${STATE_DIR}" push --force-with-lease origin "HEAD:${STATE_BRANCH}"
          else
            git -C "${STATE_DIR}" commit -m "update rhacco news state"
            git -C "${STATE_DIR}" push origin "HEAD:${STATE_BRANCH}"
          fi
