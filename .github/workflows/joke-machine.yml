name: Joke Machine
run-name: Joke Check

on:
  workflow_call:
    inputs:
      force:
        description: Generate a fresh trio regardless of the last run time
        type: boolean
        default: false
    secrets:
      GROQ_API_KEY:
        description: Groq API key for both models
        required: true
    outputs:
      state_updated:
        description: A new joke trio was pushed to the state branch
        value: ${{ jobs.joke-machine.outputs.state_updated }}
  workflow_dispatch:
    inputs:
      force:
        description: "Auch kurz nach dem letzten Lauf ein Witztrio erzeugen"
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  joke-machine:
    name: Joke Check
    runs-on: ubuntu-24.04
    concurrency:
      group: joke-machine-state
      queue: max
      cancel-in-progress: false
    timeout-minutes: 5
    outputs:
      state_updated: ${{ steps.publish.outputs.state_updated }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restore Joke State
        run: |
          set -euo pipefail
          state_dir="$(mktemp -d)"
          state_ref="refs/remotes/origin/joke-machine-state"
          echo "JMAC_STATE_FILE=${state_dir}/web-state.json" >> "${GITHUB_ENV}"
          if git ls-remote --exit-code --heads origin joke-machine-state >/dev/null; then
            git fetch --quiet --force origin "refs/heads/joke-machine-state:${state_ref}"
          else
            rc=$?
            if [ "${rc}" -eq 2 ]; then exit 0; fi
            exit "${rc}"
          fi
          echo "JMAC_STATE_COMMIT=$(git rev-parse "${state_ref}")" >> "${GITHUB_ENV}"
          if git cat-file -e "${state_ref}:worker-jmac/data/web-state.json" 2>/dev/null; then
            git show "${state_ref}:worker-jmac/data/web-state.json" > "${state_dir}/web-state.json"
          fi

      - name: Generate Joke Trio
        working-directory: worker-jmac
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JMAC_FORCE: ${{ inputs.force }}
        run: node app/main.js

      - name: Publish Joke State
        id: publish
        run: |
          set -euo pipefail
          if [ ! -f "${JMAC_STATE_FILE}" ]; then exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${JMAC_STATE_COMMIT:-}" ]; then
            git switch --detach "${JMAC_STATE_COMMIT}"
          else
            git switch --orphan joke-machine-state-initial
          fi

          mkdir -p worker-jmac/data
          cp "${JMAC_STATE_FILE}" worker-jmac/data/web-state.json
          git add -- worker-jmac/data/web-state.json
          if git diff --cached --quiet -- worker-jmac/data/web-state.json; then exit 0; fi
          git rm --ignore-unmatch -- worker-jmac/data/{history.json,latest-results.json,reserve.json}
          git commit -m "Joke Machine state"
          git push origin "HEAD:refs/heads/joke-machine-state"
          echo "state_updated=true" >> "${GITHUB_OUTPUT}"
