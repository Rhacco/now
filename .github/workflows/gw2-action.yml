name: GW2 Action
run-name: GW2A Update

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  STATE_BRANCH: gw2-action-state

jobs:
  update:
    name: Update
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    concurrency:
      group: gw2action-update
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Restore Cache
        run: bash scripts/page-state.sh restore worker-gw2a

      - name: Build GW2 Page
        run: python3 worker-gw2a/app/engine.py

      - name: Save Page & Cache
        run: bash scripts/page-state.sh publish worker-gw2a
