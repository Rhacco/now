name: GW2 Action

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gw2action-update
  cancel-in-progress: false

env:
  STATE_BRANCH: gw2-action-state

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout engine branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore latest persistent cache
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "${STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"

            if git cat-file -e "origin/${STATE_BRANCH}:worker-gw2a/data/cache.json" 2>/dev/null; then
              git show "origin/${STATE_BRANCH}:worker-gw2a/data/cache.json"                 > worker-gw2a/data/cache.json
              echo "Persistent cache restored from ${STATE_BRANCH}."
            else
              echo "State branch exists, but no cache yet; using seed cache."
            fi
          else
            echo "State branch does not exist yet; first run will create it."
          fi

      - name: Generate current GW2 page
        run: python3 worker-gw2a/app/engine.py

      - name: Publish page and persistent cache to state branch
        shell: bash
        run: |
          set -euo pipefail

          STATE_DIR="${RUNNER_TEMP}/gw2-action-state"
          rm -rf "${STATE_DIR}"

          git config user.name "gw2action-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/${STATE_BRANCH}"; then
            git worktree add --detach "${STATE_DIR}" "origin/${STATE_BRANCH}"
            git -C "${STATE_DIR}" checkout -B "${STATE_BRANCH}" "origin/${STATE_BRANCH}"
          else
            git worktree add --detach "${STATE_DIR}" HEAD
            git -C "${STATE_DIR}" checkout --orphan "${STATE_BRANCH}"
            git -C "${STATE_DIR}" rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf "${STATE_DIR}/gw2a" "${STATE_DIR}/worker-gw2a"
          mkdir -p "${STATE_DIR}/gw2a" "${STATE_DIR}/worker-gw2a/data"

          cp gw2a/index.html "${STATE_DIR}/gw2a/index.html"
          cp worker-gw2a/data/cache.json "${STATE_DIR}/worker-gw2a/data/cache.json"

          git -C "${STATE_DIR}" add -A

          if git -C "${STATE_DIR}" diff --cached --quiet; then
            echo "No state/page update needed."
            exit 0
          fi

          git -C "${STATE_DIR}" commit -m "update gw2 action state"
          git -C "${STATE_DIR}" push origin "HEAD:${STATE_BRANCH}"
