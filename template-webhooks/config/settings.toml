# Public settings only. Keep webhook URLs and other secrets outside this file.
[webhook]
provider = "discord"
secret_env = "WEBHOOK_URL"
timeout_seconds = 10

# Neutral sender identity. Providers map these fields to their own payload format.
[sender]
name = "Your Webhook"
icon_url = "https://openclipart.org/image/800px/218712"
# Default icon source: https://openclipart.org/detail/218712/paper-plane-minimal-flat-design
# Openclipart publishes its artwork under CC0 / Public Domain terms.

# Friendly default content for a manual smoke test.
[message]
text = "👋 Hello! Your webhook is working and ready to send messages."
